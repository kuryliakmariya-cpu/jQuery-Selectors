<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
		$(document).ready(function(){
			$("#hide").click(function(){
				$("p").hide(1000);
			});
			$("#show").click(function(){
				$("p").show(1000);
			});
			$("#toggle").click(function(){
				$("p").toggle();
			});
			$("#fadeIn").click(function(){
				$("#div1").fadeIn();
				$("#div2").fadeIn("slow");
				$("#div3").fadeIn(3000);
			});
			$("#fadeOut").click(function(){
				$("#div4").fadeOut();
				$("#div5").fadeOut("slow");
				$("#div6").fadeOut(3000);
			});
			$("#fadeToggle").click(function(){
				$("#div4").fadeToggle();
				$("#div5").fadeToggle("slow");
				$("#div6").fadeToggle(3000);
			});
			$("#fadeTo").click(function(){
				$("#div4").fadeTo("slow", 0.15);
				$("#div5").fadeTo("slow", 0.4);
				$("#div6").fadeTo("slow", 0.7);
			});
			$("#flip").click(function(){
				$("#panel").slideToggle("slow");
			});
			$("#animate").click(function(){
				$("#div7").animate({left: '250px', opacity: '0.5', height: '+=150px', width: '+=150px'});
			});
			$("#animate").click(function(){
				$("#div8").animate({fontSize: '3em'}, "slow");
			});


		});
	</script>
	<style>
		#panel, #flip {
			padding: 5px;
			text-align: center;
			background-color: #e5eecc;
			border: solid 1px #c3c3c3;
		}
		#panel {
			padding: 50px;
			display: none;
		}
	</style>
</head>
<body>
	
	<p>If you click on the "Hide" button, I will disappear.</p>

	<button id="hide">Hide</button>
	<button id="show">Show</button>
	<button id="toggle">Toggle</button><br><br>

	<p>Demonstrate fadeIn() with different parameters.</p>

	<div id="div1" style="width: 80px;height: 80px;display: none;background-color: red;"></div><br>
	<div id="div2" style="width: 80px;height: 80px;display: none;background-color: green;"></div><br>
	<div id="div3" style="width:80px;height:80px;display: none;background-color: blue;"></div>

	<button id="fadeIn">Click to fade in boxes</button><br><br>

	<div id="div4" style="width: 80px;height: 80px;background-color: red;"></div><br>
	<div id="div5" style="width: 80px;height: 80px;background-color: green;"></div><br>
	<div id="div6" style="width:80px;height:80px;background-color: blue;"></div><br>

	<button id="fadeOut">Click to fade out boxes</button><br><br>
	<button id="fadeToggle">Click to fade in/out boxes</button>
	<button id="fadeTo">Click to fade boxes</button>

	<div id="flip">Click to slide down panel.</div>
	<div id="panel">Hello World!</div>
	<br>
	<br>
	<br>
	<button id="animate">Start Animation</button>
	<br>
	<br>
	<div id="div7" style="background: #98bf21;height: 100px;width: 100px;position: absolute;"></div>
	<div id="div8" style="background: #98bf21;height: 100px;width: 100px;position: absolute;">HELLO</div>









</body>
</html>
